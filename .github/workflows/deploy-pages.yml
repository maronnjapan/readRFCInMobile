name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定なら GitHub Actions ビルドとして有効化を試みる
          enablement: true
      # GitHub の画面から rfcs/ に RFC テキストや日本語訳 (rfcs/ja/) を直接置いた場合も一覧に出るよう、公開する前に index.json を作り直す
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-rfc.mjs --reindex
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
