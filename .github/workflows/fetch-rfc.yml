name: Fetch RFC text into rfcs/

# 「GitHub に格納するパターン」: Actions 画面から RFC 番号を入力すると、
# rfc-editor.org から本文を取得して rfcs/ にコミットする。
on:
  workflow_dispatch:
    inputs:
      numbers:
        description: '取得する RFC 番号 (スペースまたはカンマ区切り。例: 9110 6749)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch RFC text
        run: node scripts/fetch-rfc.mjs ${{ inputs.numbers }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rfcs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Add RFC text: ${{ inputs.numbers }}"
            git push
          fi
