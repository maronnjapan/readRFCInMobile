name: Author or publish a quiz (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [generate, publish]
        required: true
      spec_id:
        description: apps/quiz/specs/index.json の ID (空なら PR のみ)
      code_source:
        description: apps/quiz/code-sources.yaml の ID (空なら仕様のみ)
      pr_number:
        description: 対象 PR 番号 (任意。code_source が必要)
      question_count:
        description: 問題数 (2〜10。選択したカテゴリ数以上)
        default: '7'
      question_categories:
        description: 出題カテゴリ (カンマ区切り)
        default: vocabulary,knowledge,flow,design,debugging,comparison,implementation
      commit:
        description: 公開する問題ファイルの固定コミット (publish の場合)
      path:
        description: 公開する apps/quiz/questions/spec/ または pr/ 内の JSON (publish の場合)
      focus_paths:
        description: 作問対象のファイル・ディレクトリ (カンマ区切り。ディレクトリは末尾 /)
      part:
        description: PR の分割番号 (8変更ファイルずつ。1から開始)
        default: '1'

permissions:
  contents: write

jobs:
  author:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: quiz-authoring
    env:
      QUIZ_API_URL: ${{ vars.QUIZ_API_URL }}
      QUESTION_REPOSITORY: ${{ github.repository }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      SPEC_ID: ${{ inputs.spec_id }}
      CODE_SOURCE: ${{ inputs.code_source }}
      PR_NUMBER: ${{ inputs.pr_number }}
      QUESTION_COUNT: ${{ inputs.question_count }}
      QUESTION_CATEGORIES: ${{ inputs.question_categories }}
      PUBLISH_COMMIT: ${{ inputs.commit }}
      PUBLISH_PATH: ${{ inputs.path }}
      FOCUS_PATHS: ${{ inputs.focus_paths }}
      PART: ${{ inputs.part || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: generate
        if: env.OPERATION == 'generate'
        shell: bash
        run: |
          args=(generate --spec "$SPEC_ID" --count "$QUESTION_COUNT" --categories "$QUESTION_CATEGORIES")
          if [[ -n "$CODE_SOURCE" ]]; then args+=(--source "$CODE_SOURCE"); fi
          if [[ -n "$PR_NUMBER" ]]; then args+=(--pr "$PR_NUMBER"); fi
          if [[ -n "$FOCUS_PATHS" ]]; then args+=(--paths "$FOCUS_PATHS"); fi
          args+=(--part "$PART")
          node apps/quiz/tools/authoring/quiz.mjs "${args[@]}"
      - if: env.OPERATION == 'generate'
        env:
          GENERATED_PATH: ${{ steps.generate.outputs.path }}
        run: |
          git switch -c "quiz/generated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$GENERATED_PATH"
          git commit -m 'Generate draft quiz for review'
          git push origin HEAD
          {
            echo '### 作問候補のレビュー'
            echo "[候補を見る](https://github.com/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/${GENERATED_PATH})"
            echo
            echo 'レビュー後に status を published に変更してコミット・push し、同じ Workflow の publish を実行してください。'
            echo "問題ファイル: ${GENERATED_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.OPERATION == 'publish'
        run: node apps/quiz/tools/authoring/quiz.mjs publish --commit "$PUBLISH_COMMIT" --path "$PUBLISH_PATH"
